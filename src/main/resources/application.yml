app:
  info:
    title: @project.name@
    description: @project.description@
    version: @project.version@

server:
  port: ${PORT:8080}
  servlet:
    context-path: /prjsredis001/v1

spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  profiles:
    active: ${SPRING_PROFILE_ACTIVE:dev}
  application:
    name: products-api

  datasource:
    url: jdbc:postgresql://localhost:5432/admin
    username: ${DATASOURCE_USERNAME:admin}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 6000

#  security:
#    jwt:
#      secret: my-super-secret-key
#      expiration: 3600000 # 1 hour in ms

logging:
  level:
    root: ${ROOT_LOG_LEVEL:INFO}
    org.flywaydb: WARN
    org.springframework.boot.autoconfigure.flyway: WARN

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    enabled: true
    path: /v3/api-docs
